name: "Essensplaner"
version: "0.8.0"
slug: "essensplaner"
description: "Rezeptverwaltung, Wochenplanung und Einkaufsliste mit Home-Assistant-Anbindung (Kalender, To-do/Bring!, input_select)"
url: "https://github.com/Seboeck/ha-essensplaner"
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:silverware-fork-knife
panel_title: "Essensplaner"
options:
  ha_url: "http://supervisor/core"
  calendar_entity: "calendar.essensplan"
  todo_entity: "todo.einkaufen"
  family_adults: 2
  family_kids: 2
  db_path: "/share/essensplaner/essensplaner.db"
schema:
  ha_url: str
  calendar_entity: str
  todo_entity: str
  family_adults: int
  family_kids: int
  db_path: str
map:
  - share:rw
hassio_api: true
homeassistant_api: true
auth_api: true
